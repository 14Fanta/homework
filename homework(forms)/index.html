<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Домашнее задание по формам</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./css/style.css" />
		<link rel="stylesheet" href="./css/normalize.css" />
	</head>
	<body>
		<form class="form">
			<fieldset class="form__group">
				<legend class="form__group--title">Ваши личные данные</legend>
				<label for="name">Ваше имя</label>
				<input id="name" type="text" placeholder="Имя" required />
				<label>
					Ваш возраст
					<input
						type="number"
						inputmode="numeric"
						placeholder="Возраст"
						required
					/>
				</label>
				<label for="number_tel">Ваш номер телефона</label>
				<input
					id="number_tel"
					type="tel"
					inputmode="tel"
					placeholder="Номер телефона"
					required
				/>
				<label>
					Ваша почта
					<input type="email" inputmode="email" placeholder="Почта" />
				</label>
				<label for="message_additionally">Сообщение</label>
				<textarea
					name="message_additionally"
					id="message_additionally"
					placeholder="Ваше сообщение"
				></textarea>
				<label class="label_last">
					<input class="checkbox_agree" type="checkbox" required />
					<span class="checkbox-text">Я принимаю правила</span>
				</label>
				<button class="button_submit" type="submit" >Отправить</button>
			</fieldset>
		</form>
	</body>
</html>
