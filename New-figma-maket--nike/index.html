<!doctype html>
<html class="page" lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Nike Air Mag</title>
		<link rel="stylesheet" href="./css/index.css" />
		<link
    rel="shortcut icon"
    href="./icons/nike-favicon-48x48.ico"
    type="image/x-icon"
		/>
	</head>
	<body class="page__body">
		<header class="header">
			<div class="container">
				<div class="header__container">
					<a href="/" class="header__logo-link logo-link"
						><img
							width="50"
							height="20"
							src="./icons/nike-logo.svg"
							alt="Логотип сайта Nike Air Mag"
							class="header__logo-img logo-img"
					/></a>
					<nav class="menu header__menu" id="header__menu" aria-label="Главное меню" > 
						<ul class="menu-list">
							<li class="menu-item">
								<a class="menu-link" href="#air-mag" lang="en">Air Mag</a>
							</li>
							<li class="menu-item">
								<a class="menu-link" href="#sizes">Размеры</a>
							</li>
							<li class="menu-item">
								<a class="menu-link" href="#characterisrics">Характеристики</a>
							</li>
							<li class="menu-item">
								<a class="menu-link" href="#top-models">Другие ТОП модели</a>
							</li>
						</ul>
					</nav>
					<div class="header__controls">
						<a class="header__order text-little" href="#">Сделать заказ</a>
						<div class="header__actions">
							<button
								class="header__actions-btn"
								type="button"
								title="Поиск"
								aria-label="Поиск"
							>
								<svg width="24" height="24">
									<use
										class="header__actions-icon"
										href="./icons/sprite.svg#search"
									></use>
								</svg>
							</button>
							<button
								class="header__actions-btn"
								type="button"
								title="Корзина"
								aria-label="Корзина"
							>
								<svg width="24" height="24">
									<use
										class="header__actions-icon"
										href="./icons/sprite.svg#cart"
									></use>
								</svg>
							</button>
							<button
								type="button"
								title="Меню"
								class="header__burger burger"
								aria-label="Открыть меню"
                aria-expanded="false"
                aria-controls="header__menu"
							>
								<svg width="24" height="24">
									<use
										class="burger__icon-menu"
										href="./icons/sprite.svg#menu-burger-icon"
									></use>
									<use
										class="burger__icon-cross"
										href="./icons/sprite.svg#cross"
									></use>
								</svg>
							</button>
						</div>
					</div>
				</div>
			</div>
		</header>
	</body>
  <script type="module" src="./js/index.js"></script>
</html>
